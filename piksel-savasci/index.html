<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Piksel Savaşçı — Parça 12: Kol ve zincir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1d1a2b;
    --ink: #f6ead2;
    --stick: rgba(29, 26, 43, 0.45);
    --stick-edge: rgba(246, 234, 210, 0.6);
    --accent: #ffcf4a;
    --cw: 400px; --ch: 224px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #1d1a2b; }
  }
  :root[data-theme="dark"] { --bg: #1d1a2b; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
  }
  /* #wrap her zaman yatay: telefon dik tutulursa 90° döndürülür */
  #wrap { position: absolute; top: 0; left: 0; transform-origin: top left; overflow: hidden; }
  #game { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game canvas {
    width: var(--cw) !important; height: var(--ch) !important; margin: 0 !important;
  }
  #hud { position: absolute; top: 10px; left: 16px; pointer-events: none; text-shadow: 2px 2px 0 #000; line-height: 1.1; }
  #hud .world { font-size: 18px; font-weight: 700; color: var(--accent); }
  #hud .area { font-size: 14px; }
  #hud .bars { margin-top: 6px; display: grid; grid-template-columns: auto 120px; gap: 3px 6px; align-items: center; font-size: 12px; }
  .bar { height: 9px; background: rgba(20, 16, 30, 0.75); border: 2px solid #1a1020; border-radius: 3px; overflow: hidden; }
  .bar { position: relative; }
  .bar i { position: absolute; left: 0; top: 0; height: 100%; width: 100%; }
  #hpChip { background: #ffd0c8; }
  #hpFill { background: #e8343a; }
  #shFill { background: #5ab0e8; }
  #shFill.broken { background: #8d8a96; }
  #enFill { background: #7ad84a; }
  #enFill.low { background: #c8d0b8; }
  #poFill { background: #ff9a3a; }
  #poFill.exposed { background: #ff3a3a; animation: blink 0.25s steps(2) infinite; width: 100% !important; }
  @keyframes blink { 50% { background: #ffffff; } }
  @media (prefers-reduced-motion: reduce) { #poFill.exposed { animation: none; } }

  .act {
    position: absolute; border-radius: 50%; padding: 0; touch-action: none;
    background: var(--stick); border: 3px solid var(--stick-edge); color: var(--ink);
    font: 700 15px "Fredoka", "Trebuchet MS", sans-serif;
  }
  .act.on { background: rgba(246, 234, 210, 0.38); transform: scale(0.94); }
  .act:focus-visible { outline: 3px solid var(--accent); }
  #btnAtk { right: 24px; bottom: 22px; width: 88px; height: 88px; font-size: 17px; }
  #btnGuard { right: 124px; bottom: 16px; width: 70px; height: 70px; }
  #btnDash { right: 34px; bottom: 122px; width: 66px; height: 66px; }
  #hud .gold { margin-top: 4px; font-size: 17px; font-weight: 700; color: var(--accent); }
  #tapZone { position: absolute; right: 0; top: 0; bottom: 0; width: 50%; touch-action: none; }

  /* Market penceresi */
  #shop {
    position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(12, 9, 22, 0.62); opacity: 0; pointer-events: none; transition: opacity 0.18s;
  }
  #shop.open { opacity: 1; pointer-events: auto; }
  #shopPanel {
    width: min(94%, 640px); max-height: 94%; box-sizing: border-box; padding: 10px 12px 12px;
    background: #2c2646; border: 4px solid #1a1020; border-radius: 10px;
    box-shadow: 0 0 0 3px #e6c486, 0 10px 0 3px rgba(0, 0, 0, 0.35);
    transform: translateY(40px) scale(0.8); transition: transform 0.3s cubic-bezier(0.2, 1.5, 0.4, 1);
  }
  #shop.open #shopPanel { transform: none; }
  .shopHead { display: flex; align-items: center; gap: 12px; }
  .shopHead h2 { margin: 0; font-size: 22px; color: var(--accent); flex: 1; }
  .shopHead .gold { font-size: 16px; color: var(--accent); }
  #shop button { font: 700 14px "Fredoka", "Trebuchet MS", sans-serif; border: 3px solid #1a1020; border-radius: 7px; padding: 5px 10px; color: #1a1020; background: #e6c486; }
  #shop button:focus-visible { outline: 3px solid #fff; }
  #shopClose { background: #ff8a7a; }
  #shopTabs { display: flex; gap: 6px; margin: 8px 0; }
  #shopTabs button { flex: 1; background: #453c66; color: var(--ink); font-size: 12px; padding: 5px 2px; }
  .item { padding: 5px !important; gap: 2px !important; }
  .item .name { font-size: 13px !important; }
  #shopTabs button.on { background: var(--accent); color: #1a1020; }
  #shopGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .item { background: #3a3258; border: 3px solid #1a1020; border-radius: 8px; padding: 7px; text-align: center; display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .item.equipped { border-color: #7fd4ff; }
  .item img { width: 76px; height: 30px; object-fit: contain; image-rendering: pixelated; }
  .item .name { font-size: 15px; font-weight: 700; }
  .item .stat { font-size: 12px; opacity: 0.85; min-height: 14px; }
  .item .price { font-size: 13px; color: var(--accent); }
  .item button.owned { background: #9fe08a; }
  .item button.worn { background: #7fd4ff; }
  .item button.poor { background: #8d8a96; }
  #btnAvatar {
    position: absolute; top: 10px; right: 16px; font: 700 14px "Fredoka", "Trebuchet MS", sans-serif; touch-action: none;
    color: var(--ink); background: var(--stick); border: 3px solid var(--stick-edge); border-radius: 10px; padding: 6px 12px;
  }
  #btnAvatar:focus-visible { outline: 3px solid var(--accent); }
  #avatars {
    position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(12, 9, 22, 0.62); opacity: 0; pointer-events: none; transition: opacity 0.18s;
  }
  #avatars.open { opacity: 1; pointer-events: auto; }
  #avatarPanel {
    width: min(94%, 640px); max-height: 94%; box-sizing: border-box; padding: 10px 12px 12px;
    background: #2c2646; border: 4px solid #1a1020; border-radius: 10px; box-shadow: 0 0 0 3px #e6c486, 0 10px 0 3px rgba(0, 0, 0, 0.35);
    transform: translateY(40px) scale(0.8); transition: transform 0.3s cubic-bezier(0.2, 1.5, 0.4, 1);
  }
  #avatars.open #avatarPanel { transform: none; }
  #avatarClose { font: 700 14px "Fredoka", "Trebuchet MS", sans-serif; border: 3px solid #1a1020; border-radius: 7px; padding: 5px 10px; color: #1a1020; background: #ff8a7a; }
  #avatarGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
  .avatar { background: #3a3258; border: 3px solid #1a1020; border-radius: 8px; padding: 6px 2px; text-align: center; color: var(--ink); font: 700 12px "Fredoka", "Trebuchet MS", sans-serif; }
  .avatar.on { border-color: var(--accent); background: #4a4070; }
  .avatar img { display: block; width: 100%; max-width: 64px; margin: 0 auto 4px; image-rendering: pixelated; }
  .avatar:focus-visible { outline: 3px solid #fff; }
  /* Ahşap tuş teması: kalın koyu çerçeve, üstte açık altta koyu kenar, krem yazı */
  .act, #btnAvatar, #shop button, #avatarClose, .avatar {
    background: #8f5e36; border: 3px solid #3a2414; color: #f8e2a8; letter-spacing: 0.5px; font-weight: 700;
    box-shadow: inset 0 3px 0 #b88450, inset 0 -5px 0 #6c4426, 0 3px 0 rgba(20, 12, 6, 0.4);
    text-shadow: -1px -1px 0 #3a2414, 1px -1px 0 #3a2414, -1px 1px 0 #3a2414, 1px 1px 0 #3a2414, 0 3px 0 #3a2414;
  }
  .act { opacity: 0.92; }
  .act.on, #shop button:active, #btnAvatar:active, #avatarClose:active, .avatar:active {
    background: #7c5030; transform: translateY(2px) scale(0.97); box-shadow: inset 0 2px 0 #9a6c40, inset 0 -2px 0 #6c4426;
  }
  #shopClose, #avatarClose { background: #a8483a; box-shadow: inset 0 3px 0 #cc6a58, inset 0 -5px 0 #7c3026, 0 3px 0 rgba(20, 12, 6, 0.4); }
  #shopTabs button { background: #6c4426; box-shadow: inset 0 3px 0 #8a5c38, inset 0 -4px 0 #523018; color: #e8cc90; }
  #shopTabs button.on { background: #c08a48; box-shadow: inset 0 3px 0 #e0b070, inset 0 -5px 0 #94622e; color: #fff4d0; }
  .item button.owned { background: #6a9444; box-shadow: inset 0 3px 0 #8cb860, inset 0 -5px 0 #4a6e2c; }
  .item button.worn { background: #4a82a4; box-shadow: inset 0 3px 0 #70a8c8, inset 0 -5px 0 #325e7c; }
  .item button.poor { background: #7a726a; box-shadow: inset 0 3px 0 #9a928a, inset 0 -5px 0 #5a524a; color: #d8d0c4; }
  .avatar.on { background: #c08a48; box-shadow: inset 0 3px 0 #e0b070, inset 0 -5px 0 #94622e, 0 0 0 3px #ffcf4a; }
  #shopPanel, #avatarPanel { background: #5a3a24; box-shadow: 0 0 0 3px #c08a48, 0 10px 0 3px rgba(0, 0, 0, 0.35); }
  .item { background: #6c4628; }
  #shopMsg { min-height: 18px; margin-top: 6px; font-size: 13px; text-align: center; color: #ffb0a0; }

  #stickZone { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; touch-action: none; }
  #stick {
    position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
    background: var(--stick); border: 3px solid var(--stick-edge); pointer-events: none;
    left: 0; top: 0; opacity: 0; transition: opacity 0.35s ease-out;
  }
  #stick.active { opacity: 1; transition: none; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; background: var(--ink); opacity: 0.85;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>
  <div id="hud">
    <div class="world">Dünya 1</div>
    <div class="area">Yeşil Vadi</div>
    <div class="gold">Altın <b id="goldTxt">0</b></div>
  </div>
  <div id="tapZone"></div>
  <div id="stickZone" aria-label="Hareket kolu"></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="btnGuard" class="act" data-act="guard" aria-label="Savun (basılı tut)">SİPER</button>
  <button id="btnDash" class="act" data-act="dash" aria-label="İleri atıl">ATIL</button>
  <button id="btnAtk" class="act" data-act="atk" aria-label="Saldır">VUR</button>

  <button id="btnAvatar">Karakter</button>
  <div id="avatars" role="dialog" aria-label="Karakter seç">
    <div id="avatarPanel">
      <div class="shopHead"><h2>Karakterini seç</h2><button id="avatarClose">Kapat</button></div>
      <div id="avatarGrid"></div>
    </div>
  </div>
  <div id="shop" role="dialog" aria-label="Silah Tüccarı">
    <div id="shopPanel">
      <div class="shopHead">
        <h2>Silah Tüccarı</h2>
        <span class="gold">Altın <b id="shopGold">0</b></span>
        <button id="shopClose">Kapat</button>
      </div>
      <div id="shopTabs"></div>
      <div id="shopGrid"></div>
      <div id="shopMsg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
/* =========================================================
   PİKSEL SAVAŞÇI — Parça 2: Yumruk ve siper
   Bölümler (ileride ayrı dosyalara ayrılacak):
   CONFIG · PALETTE · Screen · SaveService · Art · WorldGen · Controls · WorldScene

   RENK KURALI
   - Zemin ve süsler : soluk, düşük doygunluk (yeşil / toprak)
   - Oyuncu          : koyu dış çizgi + parlak sıcak renk (kırmızı / krem)
   - Düşmanlar       : koyu dış çizgi + mor / pembe ailesi (Parça 3)
   - Ödüller         : parlak sarı
   ========================================================= */

const CONFIG = { height: 152, minWidth: 270, maxWidth: 360, tile: 16, speed: 82, cols: 64, rows: 44 };

/* Dövüş ayarları — ileride ekipman verisi buradan/sunucudan gelecek */
const COMBAT = {
  hpMax: 100, hpRegen: 2,
  // Enerji: ileri atılma harcar, zamanla dolar
  energy: { max: 100, dashCost: 34, regen: 20, regenDelay: 500 },
  dash: { time: 150, speed: 300 },
  // Denge: hasar aldıkça azalır. Bitince 3 sn "savunmasız" olursun; o sırada yediğin vuruş 2 kat hasar verir
  poise: { max: 100, perDamage: 2.3, regen: 9, regenDelay: 4000, exposedTime: 3000, critMult: 2 },
  // Savunma türü eldeki ekipmana göre seçilir: kalkan > kılıç > çıplak el
  guards: {
    hands:  { name: 'El siperi',       max: 40,  regen: 14 },
    sword:  { name: 'Kılıç savunması', max: 70,  regen: 16 },
    shield: { name: 'Kalkan',          max: 120, regen: 18 }
  },
  guardRegenDelay: 900, guardMoveFactor: 0.45,
  dummy: { dmg: 15, range: 30, windup: 480, cooldown: 1700 }
};
/* Eşya verisi — ileride sunucudan gelecek, denge ayarı buradan yapılır */
const ITEMS = {
  // Silahlar: 12 tür, hepsi 1. seviye (başlangıç) görünüşünde. XP sistemi gelince seviye atlayıp görünüş değiştirecekler.
  sword_basic:   { type: 'sword',   tab: 'blade', name: 'Kılıç',             dmg: [6, 9],   guard: 35, price: 0 },
  axe_war:       { type: 'axe',     tab: 'blade', name: 'El Baltası',        dmg: [5, 8],   guard: 26, price: 0 },
  mace_iron:     { type: 'mace',    tab: 'blade', name: 'Topuz',             dmg: [10, 13], guard: 30, price: 0 },
  claw_steel:    { type: 'claw',    tab: 'blade', name: 'Pençe',             dmg: [4, 6],   guard: 22, price: 0 },
  flail_spike:   { type: 'flail',   tab: 'range', name: 'Zincirli Gürz',     dmg: [8, 12],  guard: 20, price: 0 },
  poleaxe_long:  { type: 'poleaxe', tab: 'pole',  name: 'Uzun Balta',        dmg: [13, 18], guard: 35, price: 0 },
  spear_wood:    { type: 'spear',   tab: 'pole',  name: 'Mızrak',            dmg: [8, 11],  guard: 30, price: 0 },
  trident_sea:   { type: 'trident', tab: 'pole',  name: 'Yaba',              dmg: [9, 13],  guard: 32, price: 0 },
  glaive_moon:   { type: 'glaive',  tab: 'pole',  name: 'Kargı',             dmg: [11, 15], guard: 35, price: 0 },
  twin_crescent: { type: 'twin',    tab: 'pole',  name: 'Çift Ağızlı Teber', dmg: [9, 13],  guard: 40, price: 0 },
  bow_hunter:    { type: 'bow',     tab: 'range', name: 'Yay',               dmg: [6, 10],  guard: 12, price: 0 },
  whip_chain:    { type: 'whip',    tab: 'range', name: 'Zincirli Hançer',   dmg: [6, 9],   guard: 18, price: 0 },
  shield_wood:   { type: 'shield', tab: 'shield', name: 'Tahta Kalkan',   guard: 55, price: 90,  col: ['#b07a44', '#d8a868', '#8a5a2c'] },
  shield_iron:   { type: 'shield', tab: 'shield', name: 'Demir Kalkan',   guard: 80, price: 260, col: ['#aab8cc', '#e0e8f4', '#7888a0'] },
  shield_gold:   { type: 'shield', tab: 'shield', name: 'Altın Kalkan',   guard: 115, price: 600, col: ['#ffcf4a', '#fff0a0', '#d89a2a'] },
  armor_leather: { type: 'armor',  tab: 'armor', name: 'Demir Zırh',     def: 2, price: 80,  col: ['#787c8a', '#a0a4b2', '#50546a'] },
  armor_chain:   { type: 'armor',  tab: 'armor', name: 'Çelik Zırh',     def: 5, price: 240, col: ['#a2aab8', '#d2d8e2', '#6a7284'] },
  armor_plate:   { type: 'armor',  tab: 'armor', name: 'Şövalye Zırhı',  def: 9, price: 560, col: ['#c6cedc', '#f6faff', '#8892a8'], trim: '#ffcf4a' }
};
// Silah sınıfı: süre (ms), bekleme, menzil, vuruş açısı (1 = dar, -1.1 = her yön), animasyon, kabza konumu (doku pikseli)
const WEAPON_CLASS = {
  sword:   { anim: 'slash',  time: 210, cooldown: 380, reach: 27, arc: 0.27, slash: 0.78, grip: 7 },
  axe:     { anim: 'chop',   time: 220, cooldown: 380, reach: 22, arc: 0.3,  slash: 0.62, grip: 6, hitAt: 0.6 },
  mace:    { anim: 'smash',  time: 300, cooldown: 520, reach: 24, arc: 0.3,  slash: 0.7,  grip: 6, hitAt: 0.65 },
  claw:    { anim: 'claw',   time: 220, cooldown: 270, reach: 18, arc: 0.2,  grip: 3, hits: 2 },
  flail:   { anim: 'flail',  time: 560, cooldown: 760, reach: 31, arc: -1.1, grip: 5, hits: 2 },
  poleaxe: { anim: 'sweep',  time: 340, cooldown: 600, reach: 36, arc: 0,    slash: 1.05, grip: 16 },
  spear:   { anim: 'thrust', time: 230, cooldown: 400, reach: 40, arc: 0.8,  grip: 18, hitAt: 0.45 },
  trident: { anim: 'thrust', time: 250, cooldown: 430, reach: 38, arc: 0.7,  grip: 18, hitAt: 0.45 },
  glaive:  { anim: 'sweep',  time: 300, cooldown: 540, reach: 36, arc: 0.1,  slash: 1.05, grip: 16 },
  twin:    { anim: 'spin',   time: 400, cooldown: 660, reach: 32, arc: -1.1, grip: 36, hits: 2 },
  bow:     { anim: 'shoot',  time: 320, cooldown: 520, reach: 150, arc: 2,   grip: 12, vertical: true, scale: 0.27 },
  whip:    { anim: 'whip',   time: 320, cooldown: 500, reach: 52, arc: 0.85, grip: 5, hitAt: 0.5 }
};
const PlayerData = { gold: 150, owned: ['sword_basic'], equipped: { weapon: 'sword_basic', shield: null, armor: null }, avatar: 'farmer', element: null,
  weaponLevel: {} }; // silah kimliği -> seviye (1-8). XP sistemi bu değeri artıracak.
const WEAPON_MAX_LEVEL = 8;
const weaponLevel = id => Math.max(1, Math.min(WEAPON_MAX_LEVEL, PlayerData.weaponLevel[id] || 1));
// Seviye başına hasar artışı (şimdilik herkes 1. seviye)
const weaponDmg = () => { const it = weaponItem(), k = 1 + 0.2 * (weaponLevel(PlayerData.equipped.weapon) - 1); return [Math.round(it.dmg[0] * k), Math.round(it.dmg[1] * k)]; };
// Zırhın göğsündeki taşın elementi (ileride eklenecek): taş ve ışık çizgileri bu renge bürünür
const ELEMENTS = { fire: '#e8343a', water: '#3a9cf0', nature: '#3cc444', shadow: '#a050e8', lightning: '#f2d422', ember: '#f28422' };
// Seçilebilir köylü avatarları
const AVATARS = [
  { id: 'farmer',  name: 'Çiftçi',  style: 'messy', hair: '#5a3a26', tunic: '#ece0c4', vest: '#6a4428', pants: '#3a3438' },
  { id: 'cook',    name: 'Aşçı',    style: 'bun',   hair: '#a84e2a', tunic: '#f0e6d0', female: { dress: '#7a4a30', apron: '#f0e2c4' } },
  { id: 'lumber',  name: 'Oduncu',  style: 'messy', hair: '#2a2228', tunic: '#4e7a52', pants: '#4a3a2c', beard: true },
  { id: 'shepherd',name: 'Çoban',   style: 'curly', hair: '#d8a848', tunic: '#44609a', pants: '#4a4048' },
  { id: 'healer',  name: 'Şifacı',  style: 'long',  hair: '#6a4028', tunic: '#f0e6d0', female: { dress: '#5e8a66', apron: '#f0e2c4' } },
  { id: 'smith',   name: 'Demirci', style: 'short', hair: '#7a4e2c', tunic: '#c8a87c', pants: '#6a4a2c', mustache: true },
  { id: 'hunter',  name: 'Avcı',    style: 'messy', hair: '#2a2228', tunic: '#8a3a3c', pants: '#2e2c34' }
];
const weaponItem = () => ITEMS[PlayerData.equipped.weapon] || ITEMS.sword_basic;
const guardInfo = () => {
  const sh = ITEMS[PlayerData.equipped.shield];
  return sh ? { kind: 'shield', max: sh.guard, regen: 18 } : { kind: weaponItem().type, max: weaponItem().guard, regen: 16 };
};

const PALETTE = {
  grass: '#7fa858', grassDark: '#6a9248', grassLight: '#98be68',
  path: '#c2a47c', pathDark: '#a88a64', pathLight: '#d6ba92',
  water: '#4f7fb4', waterLight: '#84acd4', waterDark: '#3d6798',
  cobble: '#a8a4b0', cobbleDark: '#8a8694', cobbleLight: '#c4c0cc',
  wall: '#7c7684', wallTop: '#a09aa8', wallDark: '#5a5462',
  soil: '#8a6040', soilDark: '#6e4a30',
  leaf: '#3f7a3c', leafMid: '#5a9a48', leafLight: '#9cc85c', leafDark: '#2c5630', trunk: '#6b4a32',
  outline: '#1a1020'
};

/* ---------- Ekran: her zaman yatay ---------- */
const Screen = {
  rotated: false, lw: 0, lh: 0, gameW: CONFIG.minWidth, zoom: 3,
  measure() {
    const W = window.innerWidth, H = window.innerHeight;
    this.rotated = H > W;
    this.lw = this.rotated ? H : W;
    this.lh = this.rotated ? W : H;
  },
  init() {
    this.measure();
    const w = Math.round((CONFIG.height * this.lw / this.lh) / 2) * 2;

  decor(scene) {

  // Ortaçağ tarzı bina parçaları: kiremit/pul çatı, taş duvar, ahşap iskelet
  roofTrap(ctx, x0, x1, yTop, yBot, inset, cols) {
    const k = PALETTE.outline, H = yBot - yTop;
    for (let y = yTop; y <= yBot; y++) {
      const off = Math.round(inset * (1 - (y - yTop) / H)), a = x0 + off, w = x1 - x0 - 2 * off, sub = (y - yTop) % 4, band = Math.floor((y - yTop) / 4);
      this.px(ctx, a, y, sub === 3 ? cols[1] : cols[0], w, 1);
      if (sub === 0 && band > 0) this.px(ctx, a, y, cols[2], w, 1);
      if (sub === 1 || sub === 2) for (let x = a + (band % 2 ? 2 : 5); x < a + w - 1; x += 6) this.px(ctx, x, y, cols[1]);
      this.px(ctx, a - 1, y, k); this.px(ctx, a + w, y, k);
    }
    this.px(ctx, x0 + inset - 1, yTop - 2, k, x1 - x0 - 2 * inset + 2, 2); this.px(ctx, x0 + inset, yTop - 1, cols[2], x1 - x0 - 2 * inset, 1);
    this.px(ctx, x0 - 1, yBot + 1, k, x1 - x0 + 2, 2); this.px(ctx, x0, yBot + 1, cols[1], x1 - x0, 1);
  },
  stoneWall(ctx, x, y, w, h, cols) {
    this.px(ctx, x, y, cols[0], w, h);
    for (let yy = y, row = 0; yy < y + h; yy += 5, row++) {
      this.px(ctx, x, yy + 4, cols[1], w, 1);
      for (let xx = x + (row % 2 ? 4 : 0); xx < x + w; xx += 9) { this.px(ctx, xx, yy, cols[1], 1, 4); if (xx + 1 < x + w) this.px(ctx, xx + 1, yy, cols[2], Math.min(7, x + w - xx - 1), 1); }
    }
  },
  chimney(ctx, x, y, h) {
    const k = PALETTE.outline;
    this.px(ctx, x, y, k, 9, h); this.stoneWall(ctx, x + 1, y + 2, 7, h - 2, ['#a49cb0', '#7c7488', '#c8c0d0']);

  window(ctx, x, y, shutter) {

    this.px(ctx, x - 3, y + 4, k, 3, 1); this.px(ctx, x + 11, y + 4, k, 3, 1); this.px(ctx, x - 3, y + 8, k, 3, 1); this.px(ctx, x + 11, y + 8, k, 3, 1);
    this.px(ctx, x, y, k, 11, 12); this.px(ctx, x + 1, y + 1, '#6a4226', 9, 10);
    this.px(ctx, x + 2, y + 2, '#bfeaff', 7, 8); this.px(ctx, x + 2, y + 6, '#8fd0f4', 7, 4); this.px(ctx, x + 3, y + 3, '#ffffff', 2, 1);
    this.px(ctx, x + 5, y + 2, '#6a4226', 1, 8); this.px(ctx, x + 2, y + 5, '#6a4226', 7, 1);
    // çiçeklik
    this.px(ctx, x - 1, y + 12, k, 13, 4); this.px(ctx, x, y + 13, '#8a5a34', 11, 2);
    this.px(ctx, x, y + 11, PALETTE.leafMid, 11, 2); this.px(ctx, x + 1, y + 10, '#ff5a5a', 2, 2); this.px(ctx, x + 5, y + 10, '#ffd84a', 2, 2); this.px(ctx, x + 8, y + 10, '#ff8ab8', 2, 2);
  },
  door(ctx, x, y) {
    const k = PALETTE.outline;
    this.px(ctx, x - 1, y + 2, k, 14, 21); this.px(ctx, x, y + 1, k, 12, 1); this.px(ctx, x + 1, y, k, 10, 1);
    this.px(ctx, x, y + 3, '#9a6238', 12, 20); this.px(ctx, x + 1, y + 1, '#9a6238', 10, 2); this.px(ctx, x + 1, y + 1, '#b87c4a', 10, 1);
    this.px(ctx, x + 4, y + 1, '#6a4226', 1, 22); this.px(ctx, x + 8, y + 1, '#6a4226', 1, 22);
    this.px(ctx, x, y + 6, '#3a3040', 4, 1); this.px(ctx, x, y + 17, '#3a3040', 4, 1); this.px(ctx, x + 9, y + 12, '#ffcf4a', 2, 2);
    this.px(ctx, x - 3, y + 23, k, 18, 3); this.px(ctx, x - 2, y + 23, '#c8c0d0', 16, 1); this.px(ctx, x - 2, y + 24, '#a49cb0', 16, 1);
  },

  // Ortaçağ evi: dik pul çatı, alınlık, baca, ahşap iskeletli ya da taş duvar
  house(scene) {

    const make = (key, o) => {

      else {
        px(6, 45, o.wall[0], 60, 28);
        for (let i = 0; i < 26; i++) px(7 + (i * 37) % 58, 47 + (i * 13) % 25, o.wall[1], 2, 1);
        // ahşap iskelet
        [6, 24, 46, 64].forEach(x => px(x, 45, o.timber, 2, 28));

      }

      this.roofTrap(ctx, 1, 71, 10, 43, 10, o.roof);
      for (let y = 24; y <= 46; y++) {
        const h = Math.round((y - 24) * 14 / 22);

        if (h > 3) px(36 - h + 3, y, o.stone ? o.wall[0] : o.wall[0], 2 * h - 6, 1);

      px(33, 37, k, 6, 6); px(34, 38, '#bfeaff', 4, 4); px(36, 38, o.timber, 1, 4); px(34, 40, o.timber, 4, 1);
      px(21, 46, k, 30, 2); px(22, 46, o.timber, 28, 1);

    make('houseA', { roof: ['#c08a42', '#94622a', '#e0b060'], wall: ['#f4e4bc', '#dcc898'], timber: '#6a4226', shutter: '#3fae5a' });
    make('houseB', { roof: ['#4f86bc', '#386698', '#86b4dc'], wall: ['#f2f2ee', '#d4d8dc'], timber: '#5a4030', shutter: '#e0a030' });
    make('houseC', { roof: ['#8a6444', '#64442c', '#b08a62'], wall: ['#b8b4c4', '#8a8698', '#d4d0dc'], timber: '#5a4030', shutter: '#c0503a', stone: true });

};

/* ---------- Harita ---------- */
const WorldGen = {
  build() {
    const { cols, rows } = CONFIG, T = CONFIG.tile, r = Art.rng(2026);
    const data = Array.from({ length: rows }, () => Array.from({ length: cols }, () => { const v = r(); return v < 0.68 ? 0 : v < 0.87 ? 1 : 2; }));
    const rect = (c0, r0, c1, r1, t) => { for (let y = r0; y <= r1; y++) for (let x = c0; x <= c1; x++) data[y][x] = t; };
    // Yollar, meydan, tarla
    rect(2, 21, cols - 3, 22, 3);
    rect(19, 12, 20, 40, 3);
    rect(44, 22, 45, 36, 3);
    rect(26, 17, 37, 26, 5);
    rect(6, 28, 14, 33, 7);
    rect(54, 18, 60, 20, 5);  // silah tüccarının önü
    rect(15, 30, 18, 31, 3);  // tarla yolu
    rect(31, 36, 43, 37, 3);  // güney evi yolu
    rect(46, 30, 51, 30, 3);  // doğu evi yolu
    // Göletler
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const a = (x - 48) / 6.5, b = (y - 10) / 3.6, c = (x - 52) / 4, d = (y - 34) / 2.6;
      if (a * a + b * b <= 1 || c * c + d * d <= 1) data[y][x] = 4;
    }
    const lilies = [];
    for (let y = 2; y < rows - 2; y++) for (let x = 2; x < cols - 2; x++)
      if (data[y][x] === 4 && data[y - 1][x] === 4 && r() < 0.16) lilies.push({ x: x * T + 4 + Math.floor(r() * 8), y: y * T + 4 + Math.floor(r() * 8) });
    for (let y = 1; y < rows; y++) for (let x = 0; x < cols; x++)
      if (data[y][x] === 4 && data[y - 1][x] !== 4 && data[y - 1][x] !== 8) data[y][x] = 8;
    // Çevre duvarı
    rect(0, 0, cols - 1, 1, 6); rect(0, rows - 2, cols - 1, rows - 1, 6);
    rect(0, 0, 1, rows - 1, 6); rect(cols - 2, 0, cols - 1, rows - 1, 6);

    // Sabit yerleşimler
    const house = { x: 20 * T, y: 12 * T }, house2 = { x: 36 * T, y: 35 * T }, house3 = { x: 50 * T, y: 30 * T };
    const merchant = { x: 57 * T + 8, y: 20 * T + 12 }, portal = { x: 32 * T, y: 22 * T }, dummy = { x: 27 * T + 8, y: 12 * T };
    const decor = [];
    const put = (kind, x, y) => decor.push({ kind, x, y });
    // Meydan: fenerler, banklar, çiçeklikler
    [[424, 292], [600, 292], [424, 430], [600, 430]].forEach(([x, y]) => put('lamp', x, y));
    [[468, 290], [556, 290], [468, 431], [556, 431]].forEach(([x, y]) => put('bench', x, y));
    [[430, 322], [430, 394], [594, 322], [594, 394], [512, 290], [512, 431]].forEach(([x, y]) => put('planter', x, y));
    // Yol boyu fenerler ve tabelalar
    [6, 12, 23, 41, 49].forEach(c => put('lamp', c * T + 8, 21 * T - 2));
    [10, 17, 24, 40, 50, 58].forEach(c => put('lamp', c * T + 8, 23 * T + 12));
    put('signpost', 21 * T + 8, 21 * T - 2); put('signpost', 46 * T + 8, 23 * T + 12); put('signpost', 21 * T + 6, 30 * T);
    // Tüccarın yanı
    put('barrel', merchant.x - 49, merchant.y); put('barrel', merchant.x - 49, merchant.y - 9); put('crate', merchant.x + 49, merchant.y); put('crate', merchant.x + 47, merchant.y - 11);
    // Ev: kuyu, odun, fıçı
    put('well', 24 * T + 8, 16 * T); put('logs', 16 * T, 13 * T + 4); put('barrel', 23 * T + 6, 12 * T + 2); put('stump', 15 * T, 15 * T);
    // Güney evi
    put('crate', house2.x - 40, house2.y + 2); put('logs', house2.x + 44, house2.y + 2); put('planter', house2.x - 22, house2.y + 12); put('planter', house2.x + 22, house2.y + 12);
    // Doğu evi
    put('barrel', house3.x + 42, house3.y + 1); put('stump', house3.x - 44, house3.y + 2); put('logs', house3.x - 46, house3.y - 14);
    // Tarla: çit, filizler, balkabakları
    for (let c = 6; c <= 14; c++) { put('fenceH', c * T + 8, 28 * T - 1); put('fenceH', c * T + 8, 34 * T + 8); }
    for (let rw = 28; rw <= 33; rw++) { put('fenceV', 6 * T - 3, rw * T + 16); if (rw < 30 || rw > 31) put('fenceV', 15 * T + 3, rw * T + 16); }
    for (let rw = 28; rw <= 33; rw++) for (let c = 6; c <= 14; c++)
      put(r() < 0.12 ? 'pumpkin' : 'sprout', c * T + 8, rw * T + 12);
    // Kamp alanı
    put('tent', 7 * T, 8 * T); put('tent', 10 * T + 8, 7 * T); put('fire', 9 * T, 9 * T + 8); put('logs', 6 * T + 8, 10 * T); put('stump', 11 * T + 8, 10 * T);
    // Gölet kenarı
    put('bench', 44 * T, 15 * T + 4); put('barrel', 56 * T, 12 * T); put('signpost', 42 * T, 14 * T);

    // Rastgele nesneler (sadece boş çimene)
    const reserved = [[15, 6, 24, 13], [52, 14, 61, 20], [25, 9, 30, 13], [22, 14, 26, 17], [31, 29, 41, 37], [4, 4, 13, 11], [4, 26, 17, 35], [40, 13, 46, 16], [25, 16, 38, 28], [46, 24, 54, 31]];
    const used = new Set();
    decor.forEach(d => used.add(Math.floor(d.x / T) + ',' + Math.floor((d.y - 2) / T)));
    const free = (c, rw) => rw > 2 && rw < rows - 2 && c > 2 && c < cols - 3 && data[rw][c] < 3 && !used.has(c + ',' + rw) &&
      !reserved.some(([a, b, c2, d]) => c >= a && c <= c2 && rw >= b && rw <= d);
    const objects = [];
    const scatter = (kind, count, spread) => {
      for (let i = 0, tries = 0; i < count && tries < count * 30; tries++) {
        const c = 2 + Math.floor(r() * (cols - 4)), rw = 3 + Math.floor(r() * (rows - 5));
        if (!free(c, rw) || (spread && (used.has((c - 1) + ',' + rw) || used.has((c + 1) + ',' + rw) || used.has(c + ',' + (rw - 1)) || used.has(c + ',' + (rw + 1)) || data[rw + 1][c] >= 3))) continue;
        for (let dy = -spread; dy <= spread; dy++) for (let dx = -spread; dx <= spread; dx++) used.add((c + dx) + ',' + (rw + dy));
        objects.push({ kind, x: c * T + 8, y: rw * T + 14 });
        i++;
      }
    };
    scatter('tree', 90, 1); scatter('rock', 32, 0); scatter('bush', 48, 0); scatter('stump', 10, 0); scatter('logs', 6, 0);
    // Çeşitlilik: ağaçların bir kısmı çam; kaya ve tomruklar farklı biçimlerde (konuma göre sabit seçilir)
    objects.forEach(o => {
      const hsh = Math.floor(o.x / T) * 7 + Math.floor(o.y / T) * 13;
      if (o.kind === 'tree' && hsh % 5 < 2) o.kind = 'pine';
      if (o.kind === 'rock') o.f = hsh % 4;
      if (o.kind === 'logs') o.f = hsh % 2;
    });
    decor.forEach(o => { if (o.kind === 'logs') o.f = 0; });
    const flowers = [], tufts = [];
    for (let i = 0; i < 400; i++) {
      const c = 2 + Math.floor(r() * (cols - 4)), rw = 2 + Math.floor(r() * (rows - 4));
      if (data[rw][c] < 3) flowers.push({ x: c * T + 2 + Math.floor(r() * 12), y: rw * T + 5 + Math.floor(r() * 11),
        f: r() < 0.1 ? -1 : Math.floor(r() * 6) });
    }
    for (let i = 0; i < 300; i++) {
      const c = 2 + Math.floor(r() * (cols - 4)), rw = 2 + Math.floor(r() * (rows - 4));
      if (data[rw][c] < 3) tufts.push({ x: c * T + 2 + Math.floor(r() * 12), y: rw * T + 5 + Math.floor(r() * 11) });
    }
    return { data, objects, flowers, tufts, lilies, decor, house, house2, house3, merchant, portal, dummy };
  }
};

/* ---------- Kontroller: yüzen sanal kol + klavye ---------- */
const Controls = {
  x: 0, y: 0, pid: null, ox: 0, oy: 0, max: 44,
  init() {
    this.watchTaps(document.getElementById('stickZone')); this.watchTaps(document.getElementById('tapZone'));
    const zone = document.getElementById('stickZone'), stick = document.getElementById('stick'), knob = document.getElementById('knob');
    const reset = () => {
      this.pid = null; this.x = this.y = 0;
      // Kol olduğu yerde kalır ve yavaşça görünmez olur (konumu sıfırlanmaz, kenara kaymaz)
      stick.classList.remove('active');
    };
    zone.addEventListener('pointerdown', e => {
      if (this.pid !== null) return;
      e.preventDefault(); this.pid = e.pointerId; zone.setPointerCapture?.(e.pointerId);
      const p = Screen.toLocal(e); this.ox = p.x; this.oy = p.y;
      knob.style.transform = '';
      stick.style.left = p.x + 'px'; stick.style.top = p.y + 'px'; stick.classList.add('active');
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== this.pid) return;
      const p = Screen.toLocal(e);
      let dx = p.x - this.ox, dy = p.y - this.oy;
      const len = Math.hypot(dx, dy);
      if (len > this.max) { dx = dx / len * this.max; dy = dy / len * this.max; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      this.x = Math.abs(dx) < 8 ? 0 : dx / this.max;
      this.y = Math.abs(dy) < 8 ? 0 : dy / this.max;
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev =>
      zone.addEventListener(ev, e => { if (e.pointerId === this.pid) reset(); }));
    zone.addEventListener('contextmenu', e => e.preventDefault());

    // Saldırı ve savunma tuşları
    document.querySelectorAll('.act').forEach(btn => {
      const act = btn.dataset.act;
      const down = e => {
        e.preventDefault(); btn.setPointerCapture?.(e.pointerId); btn.classList.add('on');
        if (act === 'atk') { this.atkQueued = true; this.atkHeld = true; } else if (act === 'dash') this.dashQueued = true; else this.guard = true;
      };
      const up = e => { e.preventDefault(); btn.classList.remove('on'); if (act === 'guard') this.guard = false; if (act === 'atk') this.atkHeld = false; };
      btn.addEventListener('pointerdown', down);
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, up));
      btn.addEventListener('contextmenu', e => e.preventDefault());
    });
  },
  guard: false, atkQueued: false, atkHeld: false, tap: null,
  consumeAtk() { const a = this.atkQueued; this.atkQueued = false; return a; },
  consumeTap() { const t = this.tap; this.tap = null; return t; },
  // Kısa dokunuşları yakalar (NPC'ye dokunmak için)
  watchTaps(el) {
    const downs = {};
    el.addEventListener('pointerdown', e => { downs[e.pointerId] = { p: Screen.toLocal(e), t: performance.now() }; });
    el.addEventListener('pointerup', e => {
      const d = downs[e.pointerId]; delete downs[e.pointerId];
      if (!d) return;
      const p = Screen.toLocal(e);
      if (performance.now() - d.t < 350 && Math.hypot(p.x - d.p.x, p.y - d.p.y) < 12) this.tap = p;
    });
  },
  dashQueued: false,
  consumeDash() { const a = this.dashQueued; this.dashQueued = false; return a; },
  release() { this.x = this.y = 0; this.guard = false; this.atkQueued = false; this.atkHeld = false; this.dashQueued = false; this.tap = null; }
};

  msg(t) { document.getElementById('shopMsg').textContent = t; },
  slot(it) { return it.type === 'shield' ? 'shield' : it.type === 'armor' ? 'armor' : 'weapon'; },
  stat(it) {
    if (it.type === 'shield') return 'Siper ' + it.guard;
    if (it.type === 'armor') return 'Gelen hasar -' + it.def;
    return 'Sv. 1 · Hasar ' + it.dmg[0] + '-' + it.dmg[1] + ', siper ' + it.guard;
  },
  render() {
    const P = PlayerData;
    document.getElementById('shopGold').textContent = P.gold;
    document.querySelectorAll('#shopTabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === this.tab));
    const grid = document.getElementById('shopGrid'); grid.textContent = '';
    Object.entries(ITEMS).filter(([, it]) => it.tab === this.tab).forEach(([id, it]) => {
      const owned = P.owned.includes(id), worn = P.equipped[this.slot(it)] === id;
      const card = document.createElement('div'); card.className = 'item' + (worn ? ' equipped' : '');
      const img = document.createElement('img'); img.src = this.icons[id]; img.alt = '';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = it.name;
      const stat = document.createElement('div'); stat.className = 'stat'; stat.textContent = this.stat(it);
      const price = document.createElement('div'); price.className = 'price';
      price.textContent = owned ? 'Sende var' : it.price ? it.price + ' altın' : 'Ücretsiz';
      const btn = document.createElement('button');
      if (worn) { btn.textContent = this.slot(it) === 'weapon' ? 'Kuşanıldı' : 'Çıkar'; btn.className = 'worn'; }
      else if (owned) { btn.textContent = 'Kuşan'; btn.className = 'owned'; }
      else { btn.textContent = 'Satın al'; if (P.gold < it.price) btn.className = 'poor'; }
      btn.addEventListener('click', () => this.act(id));
      card.append(img, name, stat, price, btn); grid.appendChild(card);
    });
  },
  act(id) {
    const P = PlayerData, it = ITEMS[id], slot = this.slot(it);
    if (!P.owned.includes(id)) {
      if (P.gold < it.price) { this.msg('Altının yetmiyor. ' + (it.price - P.gold) + ' altın daha lazım.'); return; }
      P.gold -= it.price; P.owned.push(id); P.equipped[slot] = id; this.msg(it.name + ' satın alındı ve kuşanıldı.');
    } else if (P.equipped[slot] === id) {
      if (slot === 'weapon') return;
      P.equipped[slot] = null; this.msg(it.name + ' çıkarıldı.');
    } else { P.equipped[slot] = id; this.msg(it.name + ' kuşanıldı.'); }
    this.scene.applyEquip(); this.scene.saveGame(); this.render();
  }
};

/* ---------- Avatar seçimi ---------- */
const AvatarUI = {
  open: false, scene: null,
  init(scene) {
    this.scene = scene;
    const grid = document.getElementById('avatarGrid');
    AVATARS.forEach(a => {
      const b = document.createElement('button'); b.className = 'avatar'; b.dataset.id = a.id;
      const img = document.createElement('img'); img.src = Art.portrait(a.id); img.alt = '';
      b.append(img, document.createTextNode(a.name));
      b.addEventListener('click', () => { PlayerData.avatar = a.id; scene.applyEquip(); scene.saveGame(); this.render(); });
      grid.appendChild(b);
    });
    document.getElementById('btnAvatar').addEventListener('click', () => this.show());
    document.getElementById('avatarClose').addEventListener('click', () => this.hide());
  },
  render() { document.querySelectorAll('.avatar').forEach(b => b.classList.toggle('on', b.dataset.id === PlayerData.avatar)); },
  show() { if (Shop.open) return; this.open = true; Controls.release(); this.render(); document.getElementById('avatars').classList.add('open'); },
  hide() { this.open = false; Controls.release(); document.getElementById('avatars').classList.remove('open'); }
};

/* ---------- Oyun sahnesi ---------- */
class WorldScene extends Phaser.Scene {
  constructor() { super('World'); }

  create() {
    Art.build(this);
    // Yüksek yoğunluklu dokular yarı ölçekte gösterilir
    const addImage = this.add.image;
    this.add.image = (x, y, key, frame) => { const o = addImage.call(this.add, x, y, key, frame); if (Art.hi.has(key)) o.setScale(Art.scales[key] || 0.5); return o; };
    const T = CONFIG.tile, world = WorldGen.build();
    const worldW = CONFIG.cols * T, worldH = CONFIG.rows * T;

    // Zemin
    const map = this.make.tilemap({ data: world.data, tileWidth: T, tileHeight: T });
    const tileset = map.addTilesetImage('tiles', 'tiles', T, T, 0, 0);
    this.layer = map.createLayer(0, tileset, 0, 0).setVisible(false); // sadece çarpışma için
    this.layer.setCollision([4, 6, 8]);
    // Görünen zemin: 32 piksellik karolar, yarı ölçekte
    const toHi = (t, x, y) => t < 3 ? ((x * 7 + y * 13 + (x * y) % 5) % 4) : [4, 5, 6, 7, 8, 9][t - 3];
    const hiData = world.data.map((row, y) => row.map((t, x) => toHi(t, x, y)));
    const mapHi = this.make.tilemap({ data: hiData, tileWidth: 32, tileHeight: 32 });
    mapHi.createLayer(0, mapHi.addTilesetImage('tilesHi', 'tilesHi', 32, 32, 0, 0), 0, 0).setScale(0.5).setDepth(-1000);
    // Yol kenarlarına ot öbekleri: yol ile çimen arası keskin çizgi yumuşar
    const er = Art.rng(808);
    for (let y = 2; y < CONFIG.rows - 2; y++) for (let x = 2; x < CONFIG.cols - 2; x++) {
      if (world.data[y][x] !== 3) continue;
      [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy]) => {
        if (world.data[y + dy][x + dx] >= 3) return;
        for (let i = 0; i < 2; i++) {
          const ex = x * T + (dx ? (dx > 0 ? 15 : 1) : 2 + er() * 12), ey = y * T + (dy ? (dy > 0 ? 17 : 3) : 4 + er() * 12);
          this.add.image(ex, ey, 'tuft').setOrigin(0.5, 1).setDepth(-990);
        }
      });
    }

    // Süsler ve engeller (derinlik = ayak hizası, böylece karakter arkasından geçebilir)
    this.solids = this.physics.add.staticGroup();
    const solid = (x, y, w, h) => { const z = this.add.zone(x, y, w, h); this.physics.add.existing(z, true); this.solids.add(z); };
    world.flowers.forEach(f => (f.f < 0 ? this.add.image(f.x, f.y, 'mushroom') : this.add.image(f.x, f.y, 'flower', f.f)).setOrigin(0.5, 1).setDepth(-500));

    // Kelebekler ve uğur böcekleri (sadece süs)
    this.critters = [];
    const cr = Art.rng(77), tints = [0xffe14a, 0xffffff, 0xff9a3a, 0x7ad0ff, 0xff8ab8];
    for (let i = 0; i < 26; i++) {
      const fl = world.flowers[Math.floor(cr() * world.flowers.length)], fly = i < 18;
      const img = fly ? this.add.image(fl.x, fl.y - 8, 'bfly', 0).setTint(tints[i % tints.length]).setDepth(90000)
                      : this.add.image(fl.x, fl.y, 'bug').setDepth(-450);
      this.critters.push({ img, fly, hx: fl.x, hy: fl.y - (fly ? 8 : 0), a: cr() * 6.28, speed: fly ? 14 : 3, flap: cr() * 200 });
    }
    world.tufts.forEach(t => this.add.image(t.x, t.y, 'tuft').setOrigin(0.5, 1).setDepth(-520));
    world.lilies.forEach(l => this.add.image(l.x, l.y, 'lily').setDepth(-900));

    // Nesneler: [çarpışma genişliği, yüksekliği, tabandan yukarı kayma, sallanma açısı]
    const KIND = { tree: [10, 8, 5, 2.5], pine: [8, 7, 4, 2], rock: [14, 7, 4, 0], bush: [14, 6, 3, 4], lamp: [5, 4, 2, 1.5], bench: [20, 6, 4, 0], planter: [16, 8, 5, 0],
      barrel: [10, 6, 3, 0], crate: [12, 7, 4, 0], well: [16, 10, 6, 0], stump: [10, 5, 3, 0], logs: [16, 6, 3, 0], fenceH: [16, 4, 3, 0],
      fenceV: [4, 16, 8, 0], signpost: [4, 3, 2, 3], tent: [24, 12, 7, 1], fire: [8, 4, 2, 0] };
    this.props = []; this.trees = [];
    const addProp = (kind, x, y, f) => {
      const img = this.add.image(x, y, kind, kind === 'fire' ? 0 : f).setOrigin(0.5, 1).setDepth(y);
      const K = KIND[kind];
      if (!K) { img.setDepth(y - 6); return img; } // filiz, balkabağı: üstünden yürünür
      solid(x, y - K[2], K[0], K[1]);
      const o = { kind, img, x, y, sway: K[3], tree: kind === 'tree' || kind === 'pine', mid: kind === 'tree' || kind === 'pine' ? 8 : Math.min(8, img.displayHeight / 2) };
      this.props.push(o); if (o.tree) this.trees.push(o);
      if (kind === 'lamp') this.tweens.add({ targets: this.add.image(x, y - 18, 'glow').setDepth(y + 1).setScale(1.5), alpha: 0.55, scale: 1.7, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      if (kind === 'fire') {
        this.time.addEvent({ delay: 160, loop: true, callback: () => img.setFrame(img.frame.name ? 0 : 1) });
        this.tweens.add({ targets: this.add.image(x, y - 6, 'glow').setDepth(y + 1).setScale(1.6), alpha: 0.5, duration: 300, yoyo: true, repeat: -1 });
      }
      return img;
    };
    world.objects.forEach(o => addProp(o.kind, o.x, o.y, o.f));
    world.decor.forEach(o => addProp(o.kind, o.x, o.y, o.f));
    [[world.house, 'houseA'], [world.house2, 'houseB'], [world.house3, 'houseC']].forEach(([h, key]) => {
      this.add.image(h.x, h.y, key).setOrigin(0.5, 1).setDepth(h.y);
      solid(h.x, h.y - 16, 62, 32);
    });

    // Meydanın ortasındaki portal (ileride diğer dünyalara geçiş)
    const po = world.portal;
    this.add.image(po.x, po.y, 'portalBase').setDepth(-800);
    const glow = this.add.image(po.x, po.y, 'portalGlow').setDepth(-799);
    this.tweens.add({ targets: glow, scale: 0.9, duration: 1100, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.tweens.add({ targets: this.add.image(po.x, po.y, 'portalSwirl').setDepth(-798), angle: 360, duration: 5000, repeat: -1 });
    this.time.addEvent({ delay: 230, loop: true, callback: () => {
      const a = Math.random() * 6.28, d = Math.random() * 15, x = po.x + Math.cos(a) * d, y = po.y + Math.sin(a) * d;
      const o = this.add.image(x, y, 'dot').setTint(Math.random() < 0.5 ? 0xd09cff : 0xff9ae8).setDepth(y + 4);
      this.tweens.add({ targets: o, y: y - 16, alpha: 0, duration: 900, onComplete: () => o.destroy() });
    } });
    this.portal = { x: po.x, y: po.y };

    // Oyuncu
    const saved = SaveService.load();
    if (saved?.player) {
      PlayerData.gold = saved.player.gold ?? PlayerData.gold;
      PlayerData.owned = (saved.player.owned || PlayerData.owned).filter(id => ITEMS[id]);
      Object.assign(PlayerData.equipped, saved.player.equipped || {});
      if (AVATARS.some(a => a.id === saved.player.avatar)) PlayerData.avatar = saved.player.avatar;
      PlayerData.element = ELEMENTS[saved.player.element] ? saved.player.element : null;
      // Eski kayıtlardaki kaldırılmış silahlar ayıklanır; başlangıç kılıcı herkeste bulunur
      if (!PlayerData.owned.includes('sword_basic')) PlayerData.owned.unshift('sword_basic');
      if (!ITEMS[PlayerData.equipped.weapon] || !PlayerData.owned.includes(PlayerData.equipped.weapon)) PlayerData.equipped.weapon = 'sword_basic';
      if (!ITEMS[PlayerData.equipped.shield]) PlayerData.equipped.shield = null;
      if (!ITEMS[PlayerData.equipped.armor]) PlayerData.equipped.armor = null;
      if (saved.player.weaponLevel) PlayerData.weaponLevel = saved.player.weaponLevel;
    }
    const keepPos = saved?.v === 5; // harita değişti: eski kayıtlı konum kullanılmaz
    const sx = keepPos ? saved.x : 32 * T, sy = keepPos ? saved.y : 25 * T + 8;
    this.shadow = this.add.image(sx, sy, 'shadow').setDepth(-400).setScale(1.1);
    this.player = this.physics.add.sprite(sx, sy, 'hero', 0).setOrigin(0.5, 1).setScale(3 / 8); // boy: ağaç ve oturaklarla orantılı
    this.player.body.setSize(27, 16).setOffset(10.5, 46);
    this.player.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, this.layer);
    this.physics.add.collider(this.player, this.solids);
    this.facing = 'down';
    this.dir = { x: 0, y: 1 };
    this.stats = { hp: COMBAT.hpMax, guard: guardInfo().max, guardBroken: false, lastGuardHit: -9999,
      energy: COMBAT.energy.max, lastDash: -9999, poise: COMBAT.poise.max, lastPoiseHit: -9999, exposedUntil: 0 };
    this.dashUntil = 0; this.dashDir = { x: 0, y: 1 }; this.stepAt = 0; this.hurtFlashUntil = 0; this.dead = false;
    this.dizzy = this.add.image(sx, sy, 'spark').setTint(0xff9a3a).setVisible(false);
    this.barG = this.add.graphics().setDepth(95000);
    this.arm = this.add.image(sx, sy, 'heroArm').setOrigin(3 / 26, 0.5);   // omuz etrafında dönen silah kolu
    this.nock = this.add.image(sx, sy, 'arrow').setScale(0.3).setVisible(false); // yay gerilirken kirişteki ok
    this.aimG = this.add.graphics().setDepth(94000);
    this.stringG = this.add.graphics();
    this.drawHand = this.add.image(sx, sy, 'heroHand').setScale(0.375).setVisible(false);
    this.chain = null; this.chargeStart = 0;
    this.bv = { hp: 1, chip: 1, chipHold: 0, chipRate: 0, guard: 1, energy: 1, poise: 1 };
    this.portalHint = this.makeText(world.portal.x, world.portal.y - 26, 'Portal: yakında açılacak', '#ecd8ff', 8).setVisible(false);
    // Görseller fizik adımından SONRA hizalanır: kılıç, gölge ve kamera karakterle aynı karede hareket eder
    this.events.on('postupdate', () => this.syncVisuals());
    this.stunUntil = 0; this.punchStart = 0; this.punchUntil = 0; this.punchReady = 0; this.hitIdx = 9; this.shot = true; this.arrows = [];
    this.guarding = false; this.swingSide = 1;
    this.sword = this.add.image(sx, sy, 'it_sword_basic').setScale(0.42); // karakterin yeni oranına göre biraz küçük
    this.shieldImg = this.add.image(sx, sy, 'it_shield_wood').setVisible(false);
    this.guardArc = this.add.image(sx, sy, 'guardArc5').setOrigin(0, 0.5).setVisible(false);
    this.guardPt = { x: sx, y: sy };

    // Antrenman kuklası: meydandan kaldırıldı, evin yanındaki antrenman köşesinde duruyor
    const dx = world.dummy.x, dy = world.dummy.y;
    this.dummy = { x: dx, y: dy, state: 'idle', next: 0, t: 0,
      img: this.add.image(dx, dy, 'dummy').setOrigin(0.5, 1).setDepth(dy),
      bang: this.makeText(dx, dy - 23, '!', '#ff5a8a', 12).setVisible(false) };
    solid(dx, dy - 3, 10, 6);

    // Silah tüccarı: tente + tezgâh, arkasında satıcı
    const mx = world.merchant.x, my = world.merchant.y;
    this.add.image(mx, my, 'marketBack').setOrigin(0.5, 1).setDepth(my - 29);
    this.add.image(mx, my, 'marketFront').setOrigin(0.5, 1).setDepth(my);
    solid(mx, my - 15, 80, 30);
    this.npc = { x: mx, y: my - 10, img: this.add.image(mx, my - 10, 'npc', 0).setOrigin(0.5, 1).setDepth(my - 28),
      hint: this.makeText(mx, my - 80, 'Tüccara dokun', '#fff4d6', 8).setVisible(false) };
    this.tweens.add({ targets: this.npc.img, y: this.npc.y - 1, duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    Shop.init(this); AvatarUI.init(this);
    this.applyEquip();

    const walk = (key, a, b, c) => this.anims.create({ key, frames: [b, a, c, a].map(f => ({ key: 'hero', frame: f })), frameRate: 8, repeat: -1 });
    walk('walk-down', 0, 1, 2); walk('walk-up', 3, 4, 5); walk('walk-side', 6, 7, 8);
    this.idleFrame = { down: 0, up: 3, side: 6 };

    // Kamera
    this.physics.world.setBounds(0, 0, worldW, worldH);
    const cam = this.cameras.main;
    cam.setBounds(0, 0, worldW, worldH);
    cam.setZoom(Screen.zoom);
    cam.startFollow(this.player, false, 1, 1, 0, 12); // gecikmesiz takip: karakter ekranda sabit kalır, titremez

    this.keys = this.input.keyboard.addKeys('LEFT,RIGHT,UP,DOWN,A,D,W,S,J,K,L,E,SPACE,SHIFT');
    this.time.addEvent({ delay: 3000, loop: true, callback: () => this.saveGame() });
  }

  saveGame() { SaveService.save({ v: 5, x: Math.round(this.player.x), y: Math.round(this.player.y), player: PlayerData }); }

  // Kuşanılan eşyalara göre görünümü ve savunmayı günceller
  applyEquip() {
    const e = PlayerData.equipped, hand = 'hand_' + e.weapon, key = this.textures.exists(hand) ? hand : 'it_' + e.weapon; // zincirli silahlarda elde sadece sap durur
    this.sword.setTexture(key).setOrigin(Art.grip[key] / this.textures.get(key).getSourceImage().width, 0.5).setScale(WEAPON_CLASS[weaponItem().type].scale || 0.375).setFlipY(false);
    this.chargeStart = 0;
    if (e.shield) this.shieldImg.setTexture('it_' + e.shield);
    Art.paintHero(this);
    this.stats.guard = guardInfo().max; this.stats.guardBroken = false;
  }

  tryOpenShop(viaTap) {
    const p = this.player, n = this.npc;
    if (Math.hypot(p.x - n.x, p.y - n.y) < 60) Shop.show();
    else if (viaTap) this.floatText(n.x, n.y - 30, 'Biraz yaklaş', '#fff4d6', 8);
  }

  // Yazılar büyük çizilip küçültülür: her cihazda net ve doğru boyutta görünür
  makeText(x, y, str, color, size = 9) {
    const Z = Screen.zoom;
    return this.add.text(x, y, str, { fontFamily: '"Fredoka", "Trebuchet MS", sans-serif', fontSize: (size * Z) + 'px', fontStyle: 'bold',
      color, stroke: PALETTE.outline, strokeThickness: 2 * Z }).setOrigin(0.5, 1).setDepth(99999).setScale(1 / Z);
  }
  floatText(x, y, str, color, size = 9) {
    const t = this.makeText(x, y, str, color, size);
    this.tweens.add({ targets: t, y: y - 14, alpha: 0, duration: 750, ease: 'Quad.easeIn', onComplete: () => t.destroy() });
  }
  slashFx(x, y, angle, tint, flip, size = 0.78) {
    const s = this.add.image(x, y, 'slash').setOrigin(0, 0.5).setRotation(angle).setDepth(99998).setScale(size).setFlipY(!!flip);
    if (tint) s.setTint(tint);
    this.tweens.add({ targets: s, alpha: 0, scale: size * 1.5, duration: 190, ease: 'Quad.easeOut', onComplete: () => s.destroy() });
  }
  ringFx(x, y, tint, to = 2) {
    const r = this.add.image(x, y, 'ring').setTint(tint).setScale(0.3).setDepth(99997);
    this.tweens.add({ targets: r, scale: to, alpha: 0, duration: 280, ease: 'Quad.easeOut', onComplete: () => r.destroy() });
  }
  sparkFx(x, y, scale = 2) {
    const sp = this.add.image(x, y, 'spark').setDepth(99998);
    this.tweens.add({ targets: sp, scale, alpha: 0, angle: 90, duration: 240, onComplete: () => sp.destroy() });
  }
  burst(x, y, tint, n = 7, dist = 18) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, d = dist * (0.5 + Math.random() * 0.7);
      const o = this.add.image(x, y, 'dot').setTint(tint).setDepth(99998);
      this.tweens.add({ targets: o, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, alpha: 0, duration: 260 + Math.random() * 160,
        ease: 'Quad.easeOut', onComplete: () => o.destroy() });
    }
  }

  // Adım tozu: 3 küçük toz bulutu yükselir ve 0,5 sn'de kaybolur
  stepDust(x, y, mx, my) {
    for (let i = 0; i < 3; i++) {
      const d = this.add.image(x - mx * 3 + (Math.random() * 6 - 3), y - 1 + (Math.random() * 2 - 1), 'dust').setAlpha(0.85).setScale(0.6 + Math.random() * 0.4).setDepth(y - 0.5);
      this.tweens.add({ targets: d, y: d.y - 8 - Math.random() * 3, x: d.x - mx * 3 + (Math.random() * 2 - 1), alpha: 0, scale: 1.3,
        duration: 500, ease: 'Quad.easeOut', onComplete: () => d.destroy() });
    }
  }
  // Atılma başlangıcı: 5 toz bulutu ve çakıllar geriye savrulur
  dashKick(x, y, dx, dy) {
    for (let i = 0; i < 5; i++) {
      const back = 8 + Math.random() * 16, side = Math.random() * 8 - 4;
      const d = this.add.image(x + (Math.random() * 4 - 2), y - 1, 'dust').setAlpha(0.9).setScale(0.9 + Math.random() * 0.6).setDepth(y - 0.5);
      this.tweens.add({ targets: d, x: x - dx * back - dy * side, y: y - 1 - dy * back + dx * side - 4 - Math.random() * 6, alpha: 0, scale: 2.2,
        duration: 420 + Math.random() * 120, ease: 'Quad.easeOut', onComplete: () => d.destroy() });
    }
    for (let i = 0; i < 5; i++) {
      const back = 12 + Math.random() * 16, side = Math.random() * 10 - 5, dur = 300 + Math.random() * 120;
      const o = this.add.image(x, y - 1, 'dot').setTint(i % 2 ? 0x8a7460 : 0x6a5a4c).setDepth(y + 0.5);
      const ty = y - 1 - dy * back + dx * side;
      this.tweens.add({ targets: o, x: x - dx * back - dy * side, duration: dur, onComplete: () => o.destroy() });
      this.tweens.add({ targets: o, y: ty - 7, duration: dur / 2, ease: 'Quad.easeOut', yoyo: false,
        onComplete: () => this.tweens.add({ targets: o, y: ty, duration: dur / 2, ease: 'Quad.easeIn' }) });
    }
  }

  // Ölüm: karakter yere devrilir, yarı saydam hayaleti sallanarak yükselir, sonra meydanda yeniden doğar
  die(now) {
    const p = this.player, st = this.stats;
    this.dead = true; st.hp = 0; st.exposedUntil = 0; this.dashUntil = 0; this.punchUntil = 0; this.guarding = false; this.chargeStart = 0;
    p.setVelocity(0, 0); p.anims.stop(); p.setFrame(this.idleFrame.down); p.setTint(0x9a8088);

  updateChain(dt, kind, ax, ay, target, groundY, depth) {

      if (lift >= 1) {
        for (let dd = 16; dd < range; dd += 8) gph.fillStyle(0xffffff, 0.25 + 0.45 * pw).fillRect(cx + dir.x * dd - 0.75, cy + dir.y * dd - 0.75, 1.5, 1.5);
        gph.fillStyle(pw >= 1 ? 0xffcf4a : 0xffffff, 0.9).fillRect(cx + dir.x * range - 1.5, cy + dir.y * range - 1.5, 3, 3);
      }
    } else if (this.guarding && !useShield) {
      const qx = -dir.y, qy = dir.x; // bakış yönüne dik
      this.guardPt = { x: cx + dir.x * 9, y: cy + dir.y * 8 + 1 };
      aa = Math.atan2(this.guardPt.y - qy * 4 - (p.y + shY), this.guardPt.x - qx * 4 - (p.x + shX));
      wa = worn ? aa : Math.atan2(qy, qx); wDepth = front;
    }
    // omuz -> el -> silah
    const sX = p.x + shX + ox * 0.5, sY = p.y + shY + oy * 0.5, hX = sX + Math.cos(aa) * L + ox * 0.5, hY = sY + Math.sin(aa) * L + oy * 0.5;
    const left = Math.cos(aa) < 0;
    arm.setPosition(sX, sY).setRotation(aa).setFlipY(left).setDepth(this.facing === 'up' && now >= this.punchUntil && !charging ? p.y + 0.4 : p.y + 1.6);
    if (worn) sw.setPosition(hX, hY).setRotation(aa).setFlipY(left).setDepth(arm.depth + 0.1);   // pençe ele giyilidir: kolla aynı yöne bakar
    else sw.setPosition(hX, hY).setRotation(wa).setFlipY(false).setDepth(wDepth);
    // Yay kirişi: uçlardan ok yuvasına iki çizgi. Gerilince geriye çekilir, yay da hafifçe bükülür.
    this.stringG.clear(); this.drawHand.setVisible(false);
    if (A.anim === 'shoot') {
      const sc = A.scale, pl = Math.max(0, pull), bend = pl * 0.012;
      sw.setScale(sc * (1 + bend * 1.5), sc * (1 - bend));
      const c = Math.cos(wa), sn = Math.sin(wa), loc = (lx, ly) => ({ x: hX + (lx * c - ly * sn) * sc, y: hY + (lx * sn + ly * c) * sc });
      const t1 = loc(-11 - pl * 1.2, -29 * (1 - bend)), t2 = loc(-11 - pl * 1.2, 29 * (1 - bend)), nk = loc(-10 - pl / sc, 0);
      this.stringG.setDepth(wDepth + 0.05).lineStyle(0.5, 0xf0e8d8, 1).beginPath().moveTo(t1.x, t1.y).lineTo(nk.x, nk.y).lineTo(t2.x, t2.y).strokePath();
      if (pull >= 0) {
        this.nock.setVisible(true).setScale(0.3).setOrigin(0.1, 0.5).setPosition(nk.x, nk.y).setRotation(ang).setDepth(wDepth + 0.1);
        this.drawHand.setVisible(true).setPosition(nk.x, nk.y).setDepth(wDepth + 0.2);
      }
    }
    // zincirli silahlar: sapın ucundan başlayan zincir ve ucundaki ağırlık ayrı parçalar olarak hareket eder
    if (hang) {
      const tipLen = (sw.width - sw.width * sw.originX) * 0.375;
      const end = this.updateChain(dt, A.anim, hX + Math.cos(wa) * tipLen, hY + Math.sin(wa) * tipLen, headTarget, headTarget ? 1e9 : p.y + 1, headTarget && dir.y > 0 ? p.y + 2.4 : p.y + 1.3);
      this.chainEnd = end;
    } else this.hideChain();

    // Kalkan varsa savunmayı kalkan yapar, silah elde kalır
    this.shieldImg.setVisible(useShield);
    if (useShield) {
      this.guardPt = { x: cx + dir.x * 8, y: cy + dir.y * 7 + 2 };
      this.shieldImg.setPosition(this.guardPt.x, this.guardPt.y).setDepth(front + 0.5);
    }
    this.guardArc.setVisible(this.guarding);
    if (this.guarding) {
      // Siper sağlığı yayın kendisinde görünür: hasar aldıkça kısalır ve soluklaşır
      const gf = Math.max(0, Math.min(1, st.guard / g.max));
      this.guardArc.setTexture('guardArc' + Math.max(1, Math.ceil(gf * 5)))
        .setPosition(cx, cy + 1).setRotation(ang).setAlpha((0.3 + 0.7 * gf) * (0.85 + 0.15 * Math.sin(now / 80))).setDepth(front + 1);
    }


    // Savunmasızken karakter turuncu yanıp söner, başında işaret döner
    const exposed = now < st.exposedUntil;
    this.dizzy.setVisible(exposed);
    if (exposed) {
      this.dizzy.setPosition(p.x, p.y - 48).setAngle(now / 3).setDepth(p.y + 3);
      p.setTint(Math.floor(now / 110) % 2 ? 0xffb060 : 0xffffff);
    } else if (now >= this.hurtFlashUntil && p.isTinted) p.clearTint();
  }

  update(time, delta) {
    const p = this.player, k = this.keys, st = this.stats, now = time, dt = delta / 1000;
    const g = guardInfo(), JD = Phaser.Input.Keyboard.JustDown;

    // Market açıkken oyun bekler
    if (Shop.open || AvatarUI.open) { p.setVelocity(0, 0); p.anims.stop(); return; }
    if (this.dead) { Controls.release(); p.setVelocity(0, 0); this.hudNow(now, dt); return; }
    // Satıcı: yakındaysan ipucu göster, dokununca market açılır
    const n = this.npc, tap = Controls.consumeTap();
    n.hint.setVisible(Math.hypot(p.x - n.x, p.y - n.y) < 60);
    this.portalHint.setVisible(Math.hypot(p.x - this.portal.x, p.y - this.portal.y) < 26);
    if (tap) {
      const wv = this.cameras.main.worldView;
      const wx = wv.x + (tap.x - (Screen.lw - Screen.cw) / 2) / Screen.cw * wv.width;
      const wy = wv.y + (tap.y - (Screen.lh - Screen.ch) / 2) / Screen.ch * wv.height;
      if (Math.hypot(wx - n.x, wy - (n.y - 12)) < 26) { this.tryOpenShop(true); return; }
    }
    if (JD(k.E)) { this.tryOpenShop(false); if (Shop.open) return; }
    const stunned = now < this.stunUntil, punching = now < this.punchUntil;

    // Savunma (basılı tut) ve saldırı
    const wantGuard = Controls.guard || k.K.isDown || k.SHIFT.isDown;
    this.guarding = wantGuard && !st.guardBroken && !stunned && !punching;
    const atk = Controls.consumeAtk() | JD(k.J) | JD(k.SPACE), atkHeld = Controls.atkHeld || k.J.isDown || k.SPACE.isDown;
    if (WEAPON_CLASS[weaponItem().type].anim === 'shoot') {
      // Yay: tuşa basılı tutunca nişan alır ve gerilir, bırakınca atar. Ne kadar uzun tutulursa ok o kadar hızlı ve uzağa gider.
      const can = !this.guarding && !stunned && now >= this.punchReady;
      if (this.chargeStart && !can && now >= this.punchReady) this.chargeStart = 0;
      else if (this.chargeStart && !atkHeld) { this.releaseArrow(now, Math.min(1, (now - this.chargeStart) / 1100)); this.chargeStart = 0; }
      else if (!this.chargeStart && can && atkHeld) this.chargeStart = now;
      else if (!this.chargeStart && can && atk) this.releaseArrow(now, 0.05); // çok kısa dokunuş: en zayıf atış
    } else if (atk && !this.guarding && !stunned && now >= this.punchReady) this.attack(now);

    // Hareket
    let vx = Controls.x, vy = Controls.y;
    if (k.LEFT.isDown || k.A.isDown) vx = -1; else if (k.RIGHT.isDown || k.D.isDown) vx = 1;
    if (k.UP.isDown || k.W.isDown) vy = -1; else if (k.DOWN.isDown || k.S.isDown) vy = 1;
    const len = Math.hypot(vx, vy);
    if (len > 1) { vx /= len; vy /= len; }
    let speed = CONFIG.speed;
    if (this.guarding) speed *= COMBAT.guardMoveFactor;
    if (now < this.punchUntil) speed *= 0.25;
    if (this.chargeStart) speed *= 0.4;
    // İleri atılma: enerji harcar
    const E = COMBAT.energy;
    if ((Controls.consumeDash() | JD(k.L)) && !stunned && now >= this.dashUntil) {
      if (st.energy >= E.dashCost) {
        st.energy -= E.dashCost; st.lastDash = now; this.dashUntil = now + COMBAT.dash.time;
        this.dashDir = len > 0.05 ? { x: vx / len, y: vy / len } : { x: this.dir.x, y: this.dir.y };
        this.dashKick(p.x, p.y, this.dashDir.x, this.dashDir.y);
      } else this.floatText(p.x, p.y - 50, 'Enerji yetmiyor', '#c8d0b8', 8);
    }
    const dashing = now < this.dashUntil;
    if (dashing) {
      this.guarding = false;
      p.setVelocity(this.dashDir.x * COMBAT.dash.speed, this.dashDir.y * COMBAT.dash.speed);
    } else if (!stunned) p.setVelocity(vx * speed, vy * speed);

    if (len > 0.05 && !stunned) {
      if (now >= this.punchUntil) {
        if (Math.abs(vx) >= Math.abs(vy)) { this.facing = 'side'; p.setFlipX(vx < 0); this.dir = { x: vx < 0 ? -1 : 1, y: 0 }; }
        else { this.facing = vy < 0 ? 'up' : 'down'; p.setFlipX(false); this.dir = { x: 0, y: vy < 0 ? -1 : 1 }; }
      }
      p.anims.play('walk-' + this.facing, true);
      if (!dashing && now >= this.stepAt) { this.stepAt = now + 250; this.stepDust(p.x, p.y, vx / len, vy / len); }
    } else {
      p.anims.stop(); p.setFrame(this.idleFrame[this.facing]);
    }
    // Kelebek ve böcekler
    for (const c of this.critters) {
      c.a += (Math.random() - 0.5) * (c.fly ? 0.5 : 0.2);
      const ox = c.hx - c.img.x, oy = c.hy - c.img.y;
      if (ox * ox + oy * oy > (c.fly ? 2500 : 400)) c.a = Math.atan2(oy, ox);
      c.img.x += Math.cos(c.a) * c.speed * dt; c.img.y += Math.sin(c.a) * c.speed * dt;
      if (c.fly) { c.flap += delta; c.img.setFrame(Math.floor(c.flap / 130) % 2); }
      else c.img.setFlipX(Math.cos(c.a) < 0);
    }

    // Savunma ve can dolumu
    if (!this.guarding && now - st.lastGuardHit > COMBAT.guardRegenDelay) {
      st.guard = Math.min(g.max, st.guard + g.regen * dt);
      if (st.guardBroken && st.guard >= g.max) { // tamamen dolunca tekrar kullanılabilir
        st.guardBroken = false;
        this.ringFx(p.x, p.y - 8, 0x7fd4ff, 1.6); this.floatText(p.x, p.y - 48, 'Siper hazır', '#9fe0ff', 8);
      }
    }
    st.hp = Math.min(COMBAT.hpMax, st.hp + COMBAT.hpRegen * dt);
    if (now - st.lastDash > E.regenDelay) st.energy = Math.min(E.max, st.energy + E.regen * dt);
    const PO = COMBAT.poise;
    if (st.exposedUntil && now >= st.exposedUntil) { st.exposedUntil = 0; st.poise = PO.max; } // 3 sn doldu: denge yenilenir
    else if (!st.exposedUntil && now - st.lastPoiseHit > PO.regenDelay) st.poise = Math.min(PO.max, st.poise + PO.regen * dt);

    // Kukla: yakındaysan önce uyarır (!), sonra vurur
    const d = this.dummy, C = COMBAT.dummy, dist = Math.hypot(p.x - d.x, p.y - d.y);
    if (d.state === 'idle' && now >= d.next && dist < C.range) {
      d.state = 'windup'; d.t = now + C.windup; d.bang.setVisible(true); d.img.setTint(0xffb0c8);
    } else if (d.state === 'windup' && now >= d.t) {
      d.state = 'idle'; d.next = now + C.cooldown; d.bang.setVisible(false); d.img.clearTint();
      this.dummyStrike(now);
    }

    this.hudNow(now, dt);
  }
}

/* ---------- Başlat ---------- */
Screen.init();
Controls.init();
const startGame = () => new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: Screen.gameW * Screen.zoom,
  height: CONFIG.height * Screen.zoom,
  pixelArt: true,
  roundPixels: true,
  backgroundColor: PALETTE.wall,
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false, fixedStep: false } },
  scale: { mode: Phaser.Scale.NONE, autoCenter: Phaser.Scale.NO_CENTER },
  scene: [WorldScene]
});
// Yazı tipi hazır olunca başla (en geç 1,5 sn bekler)
let started = false;
const go = () => { if (!started) { started = true; startGame(); } };
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load('700 16px Fredoka'), document.fonts.load('500 16px Fredoka')]) : Promise.resolve()).then(go, go);
setTimeout(go, 1500);
</script>
